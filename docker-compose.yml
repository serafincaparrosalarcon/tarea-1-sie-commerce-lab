services:
  backoffice:
    build: ./backoffice
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /app/data
      ADMIN_USER: ${ADMIN_USER:-admin@sensoria.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET:?Define INTEGRATION_SHARED_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:-}
      TELEGRAM_CLIENT_CHAT_ID: ${TELEGRAM_CLIENT_CHAT_ID:-}
      FRONTOFFICE_URL: ${FRONTOFFICE_URL:-https://www.sensoria.onl}
    ports:
      - "8080:8080"
    volumes:
      - backoffice_data:/app/data

  n8n:
    image: n8nio/n8n:1.117.3
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET}
      BACKOFFICE_URL: http://backoffice:8080
      GENERIC_TIMEZONE: Europe/Madrid
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/files:ro
    depends_on:
      - backoffice

volumes:
  backoffice_data:
  n8n_data:
